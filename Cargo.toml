[package]
name = "phtheirichthys"
version = "0.1.80"
authors = ["Arnaud Bouts <arnaud.bouts@orange.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phtheirichthys"
path = "src/main.rs"

[features]
default = ["console_error_panic_hook"]
land = []
wasm = ["dep:wasm-bindgen-futures", "dep:web-sys", "dep:gloo"]
tokio = ["dep:tokio"]
rayon = ["dep:rayon"]
webgl = ["dep:cubecl"]


[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
async-recursion = "1.2.0"
byteorder = "1.5.0"
cfg-if = "1.0.5"
chrono = { version = "0.4.45", default = false, features = ['serde', 'wasmbind'] }
chrono-humanize = "0.2.3"
clokwerk = "0.4.0"
console_log = "1.1.0"
geo = { version = "0.33.1", default-features = false }
geo-types = "0.7.20"
gloo = { version = "0.12.0", optional = true, features = ['timers', 'futures'] }
image = "0.25.10"
libm = "0.2.16"
log = "0.4.35"
once_cell = "1.21.4"
reqwest = { version = "0.13.5", features = ["json"] }
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default = false, features = ['js'] }
wasm-bindgen = { version = "0.2.130", optional = false }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
rayon = { version = "1.12.0", optional = true }
tokio = { version = "1.54.1", optional = true, features = ["rt", "macros", "rt-multi-thread"] }
env_logger = "0.11.11"
serde_json = "1.0.154"
cubecl = { version = "0.11.3", optional = true, features = ["wgpu"] }
rand = "0.10.3"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
futures-util = "0.3.34"
bytes = "1.12.1"
grib = { version = "0.20.2", default-features = false }

getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dependencies.web-sys]
version = "0.3.107"
optional = true
features = [
    'console',
    'FileSystemDirectoryHandle',
    'FileSystemFileHandle',
    'FileSystemGetFileOptions',
    'Navigator',
    'StorageManager',
    'Window',
    'Headers',
    'Request',
    'RequestInit',
    'RequestMode',
    'Response',
    'Url',
    'UrlSearchParams',
    'Blob',
    'WorkerGlobalScope',
    'OffscreenCanvas',
    'OffscreenCanvasRenderingContext2d',
    'ImageData',
]

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread"] }
env_logger = "0.11.11"
serde_json = "1.0.154"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
