[package]
name = "phtheirichthys"
version = "0.1.72"
authors = ["Arnaud Bouts <arnaud.bouts@orange.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phtheirichthys"
path = "src/main.rs"

[features]
default = ["console_error_panic_hook"]
land = []
wasm = ["dep:wasm-bindgen-futures", "dep:web-sys", "dep:gloo"]
tokio = ["dep:tokio"]
rayon = ["dep:rayon"]
webgl = ["dep:cubecl"]


[dependencies]
anyhow = "1.0.92"
async-trait = "0.1.83"
async-recursion = "1.1.1"
byteorder = "1.5.0"
cfg-if = "1.0.0"
chrono = { version = "0.4.38", default = false, features = ['serde', 'wasmbind'] }
chrono-humanize = "0.2.3"
clokwerk = "0.4.0"
console_log = "1.0.0"
geo = "0.29.2"
geo-types = "0.7.14"
gloo = { version = "0.11.0", optional = true, features = ['timers', 'futures'] }
image = "0.25.5"
libm = "0.2.11"
log = "0.4.22"
once_cell = "1.20.2"
reqwest = { version = "0.12.9", features = ["json"] }
rust-embed = { version = "8.5.0", features = ["include-exclude"] }
serde = { version = "1.0.214", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify-next = { version = "0.5.4", default = false, features = ['js'] }
wasm-bindgen = { version = "0.2.95", optional = false }
wasm-bindgen-futures = { version = "0.4.45", optional = true }
rayon = { version = "1.10.0", optional = true }
tokio = { version = "1.41.0", optional = true, features = ["rt", "macros", "rt-multi-thread"] }
env_logger = "0.11.5"
serde_json = "1.0.132"
cubecl = { version = "0.2.0", optional = true, features = ["wgpu"] }
rand = "0.8.5"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
futures-util = "0.3.31"
bytes = "1.7.2"
grib = "0.10.2"

[dependencies.web-sys]
version = "0.3.72"
optional = true
features = [
    'console',
    'FileSystemDirectoryHandle',
    'FileSystemFileHandle',
    'FileSystemGetFileOptions',
    'Navigator',
    'StorageManager',
    'Window',
    'Headers',
    'Request',
    'RequestInit',
    'RequestMode',
    'Response',
    'Url',
    'UrlSearchParams',
    'Blob',
    'WorkerGlobalScope',
    'OffscreenCanvas',
    'OffscreenCanvasRenderingContext2d',
    'ImageData',
]

[dev-dependencies]
wasm-bindgen-test = "0.3.45"
tokio = { version = "1.41.0", features = ["rt", "macros", "rt-multi-thread"] }
env_logger = "0.11.5"
serde_json = "1.0.132"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
